name: Contribution snake

# Draws the contribution graph being eaten by a snake, in the night palette of assets/room.gif (light and dark versions),
# and publishes the SVGs to the `output` branch, which README.md reads. Runs daily, on demand and when main changes.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#d67c5c&color_dots=#eceef5,#c9cee6,#9aa3d4,#6470b4,#363f7c
            dist/github-snake-dark.svg?color_snake=#e8916f&color_dots=#161b22,#262d52,#3b4687,#5c6abd,#909ee6

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update the contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
