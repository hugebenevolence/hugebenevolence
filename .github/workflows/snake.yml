name: Contribution snake

# Draws the contribution graph being eaten by a snake (light and dark versions) and publishes the SVGs to the `output` branch,
# which README.md reads. Runs daily, on demand and when main changes.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Generate the snake
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#2D6A4F&color_dots=#ebedf0,#b7e4c7,#74c69d,#40916c,#1b4332
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#95D5B2&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update the contribution snake
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
