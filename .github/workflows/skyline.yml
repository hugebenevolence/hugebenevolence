name: Contribution skyline

# Draws the last year of contributions as a pixel-art night city (assets/build_skyline.py) and publishes it to the
# `output` branch, which README.md reads. Runs daily, on demand, and when the drawing code changes.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - assets/build_skyline.py
      - .github/workflows/skyline.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Draw the skyline
        run: python3 assets/build_skyline.py "${{ github.repository_owner }}" dist/skyline.svg

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update the contribution skyline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
