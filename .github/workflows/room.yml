name: Room GIF

# Redraws the hero GIF (assets/build_room.py) with the latest contribution calendar, so the painting on the wall stays
# current, and publishes it to the `output` branch, which README.md reads. Runs daily, on demand, and when the drawing
# code changes.
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - assets/build_room.py
      - .github/workflows/room.yml

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: pip install pillow==11.0.0

      - name: Draw the room
        run: python assets/build_room.py "${{ github.repository_owner }}" dist/room.gif

      - name: Publish to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          commit_message: Update the room GIF
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
